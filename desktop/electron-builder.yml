appId: com.mcnai.desktop
# 2026-08-19 改名（推翻了同日「维持 mcn-ai」那条裁决）：Dock/Finder/菜单栏与界面统一叫 SamePage。
# **安全前提（RELEASE-CHECK §2.3 实测）**：userData 目录与 Keychain 服务名跟的是
# `package.json` 的 `name`（mcn-ai-desktop），**不是** productName——打进 asar 的
# package.json 里根本没有 productName 字段。所以改这里只换显示名，不动数据、不强制重登。
# **红线**：`package.json` 的 `name` 一个字不能改，也不能给它加 productName 字段——
# 那两件事才会换 userData 目录，等于把所有已装机器的配置、会话、密钥全甩掉。
productName: SamePage
directories:
  output: release
# electron-builder 只公证 .app、不公证 dmg 本身。这个钩子把 dmg 也送去公证 + 订票，
# 并重算 latest-mac.yml 里 dmg 的 sha512（订票会改字节）。原因写在脚本头部。
afterAllArtifactBuild: scripts/notarize-dmg.cjs
files:
  - out/**
  - package.json
extraResources:
  - from: resources/
    to: resources/
asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "node_modules/minisearch/**"
  - "out/main/search-worker.js"
mac:
  icon: build/icon.icns
  target:
    # zip 不是可选项：electron-updater 在 macOS 上是从 zip 增量更新的，
    # latest-mac.yml 里指的也是 zip；只出 dmg 的话自动更新拿不到包
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # ── 正式签名（Developer ID Application）与公证 ───────────────────────────
  # 显式钉死证书：留空是"自动挑一张"，机器上多一张证书就可能挑错，
  # 而挑错的表现是公证被拒（要等十几分钟才知道）。
  # **必须去掉 "Developer ID Application:" 前缀**——带上前缀 electron-builder 直接拒：
  #   "Please remove prefix "Developer ID Application:" from the specified name"
  # 证书类型由 mac target 自己定，这里只给名字那一段。取值来自：
  #   security find-identity -v -p codesigning
  identity: Senpeng Tan (6Y6F78H65Y)
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 公证走 notarytool + App Store Connect API Key（不用 App 专用密码：
  # 密钥可单独吊销、不绑 Apple ID 双因素）。三个环境变量见 docs/RELEASE.md §A：
  #   APPLE_API_KEY（.p8 文件路径）/ APPLE_API_KEY_ID / APPLE_API_ISSUER
  # 三个都不设时 electron-builder 会**静默跳过公证**——所以发版脚本必须验 stapler。
  notarize: true
dmg:
  contents:
    - x: 130
      y: 150
    - x: 410
      y: 150
      type: link
      path: /Applications
# ── 自动更新源（electron-updater，generic provider）────────────────────────
# 阿里云 OSS，西南1（成都），Bucket `samepage-updates`，公共读。
#
# **这个 url 是打包时烧进 app 包里的 `resources/app-update.yml` 的**，客户端启动后去
# `<url>/latest-mac.yml` 查版本。所以**改了它必须重新打包**——已经装到客户机上的旧包
# 记的仍是它自己被打包时的那个地址，不会跟着变。
# （2026-08-19 之前这里是 `.invalid` 占位；用占位地址打出去的包永远不会查更新，
#   那种包发出去之后要再手动换一次才能接上自动更新。）
#
# 换地址的完整步骤见 docs/RELEASE.md §C。
publish:
  provider: generic
  url: https://samepage-updates.oss-cn-chengdu.aliyuncs.com/mac/
  channel: latest
